# HITL Project Configuration
# 
# This file defines the project metadata, dependencies, and build configuration
# for the Human-in-the-Loop (HITL) anomaly filtering system.
#
# Key sections:
# - [project]: Core metadata (name, version, description, Python version requirement)
# - dependencies: Runtime requirements (numpy, pydantic, structlog, fastapi, uvicorn)
# - [project.optional-dependencies]: torch for ML models
# - [project.scripts]: Entry point for CLI (hitl command)
# - [build-system]: Build tools configuration (setuptools)
# - [tool.uv]: Development dependencies (pytest, ruff, mypy, etc.)
#
# Installation:
#   uv venv
#   uv pip install -e .[torch]
# Or with uv sync:
#   uv sync -E torch

[project]
name = "hitl"
version = "0.1.0"
description = "HITL anomaly filtering with tensor storage in SQLite and PyTorch AE"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.7",
  "structlog>=24.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.scripts]
hitl = "hitl.cli.main:app"   # CLI entry point

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests",
  "httpx>=0.27"
]
