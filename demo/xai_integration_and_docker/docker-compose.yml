services:
  xai-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
    volumes:
      - ./backend/models:/app/backend/models
      - ./backend/datasets:/app/backend/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/swagger.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
