<app-sidebar>
      <div class="container flex-container">
            @if(true){
            <h1 class="flex-item-all">Reconstruction Errors</h1>
            <div class="flex-item-all">
                  <div>
                        <div style="width: 500px;">
                              <app-heatmap [data]="data" [columnLabels]="columnLabels" [colors]="colors"
                                    [threshold]="threshold">
                              </app-heatmap>
                        </div>
                  </div>
            </div>
            } @else {
                  <h1 class="flex-item-all">No Instance Loaded...</h1>
            }
      </div>
</app-sidebar>
